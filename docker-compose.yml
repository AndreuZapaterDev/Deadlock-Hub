x-dev: &dev
  build:
    context: .
    target: dev
  env_file: .env
  volumes:
    - .:/app
    - node_modules:/app/node_modules
    - next_cache:/app/.next

services:
  app:
    <<: *dev
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"

  test:
    <<: *dev
    command: npm test

  e2e:
    image: mcr.microsoft.com/playwright:v1.51.1-noble
    working_dir: /app
    # Se prueba contra la vista previa de producción (como Vercel). Comparte la red de `preview`, así que la web es http://localhost:3000:
    # hace falta "localhost" para que el service worker tenga contexto seguro y porque en desarrollo Next bloquea la hidratación desde otro host.
    network_mode: "service:preview"
    depends_on:
      - preview
    environment:
      BASE_URL: http://localhost:3000
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    command: sh -c "npm ci && npx playwright test"

  preview:
    build:
      context: .
      target: preview
    env_file: .env
    ports:
      - "3001:3000"

volumes:
  node_modules:
  next_cache:
  e2e_node_modules:
